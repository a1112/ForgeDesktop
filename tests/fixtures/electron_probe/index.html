<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge Electron Input Probe</title>
  <style>
    body { margin: 0; padding: 24px; color: #eef3ff; background: #151d2c;
           font: 16px system-ui, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { color: #b9c8e2; }
    textarea { display: block; box-sizing: border-box; width: 100%; height: 130px;
               padding: 12px; color: #151d2c; background: #fff; border: 2px solid #6999e0;
               border-radius: 8px; font: 18px system-ui, sans-serif; resize: none; }
    output { display: block; box-sizing: border-box; min-height: 62px; margin-top: 16px;
             padding: 12px; overflow-wrap: anywhere; white-space: pre-wrap;
             color: #fff; background: #29436c; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Electron input probe</h1>
  <p>Type Chinese with Fcitx 5. The box below mirrors the editable text.</p>
  <textarea id="input" aria-label="Text input" autofocus></textarea>
  <output id="echo" aria-live="polite"></output>
  <script>
    const input = document.getElementById('input');
    const echo = document.getElementById('echo');
    input.addEventListener('input', () => { echo.textContent = input.value; });
    input.focus();
  </script>
</body>
</html>
