# Disposable test image only; never install in a release/user image.
[Unit]
ConditionPathExists=/etc/forgedesktop-isolated-test

[Service]
ExecStartPre=/usr/bin/grep -qx forgedesktop-daily-test /etc/forgedesktop-isolated-test
ExecStart=
ExecStart=/usr/bin/qemu-ga --allow-rpcs=guest-ping,guest-info,guest-sync,guest-sync-delimited,guest-exec,guest-exec-status
RestartSec=2
